<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Samsa Café — POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
/* ═══════════════════════════════════════════════
   SAMSA CAFÉ POS — styles.css  (rediseño v2)
   ═══════════════════════════════════════════════ */

/* ─── Variables ─────────────────────────────── */
:root {
  --cream:    #F5F0E8;
  --cream2:   #EDE6D6;
  --brown:    #3B2A1A;
  --brown2:   #5C3D1E;
  --caramel:  #C47F2C;
  --caramel2: #E8A84A;
  --sage:     #5C7A4E;
  --sand:     #D4C4A0;
  --white:    #FDFAF5;
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --shadow-card: 0 4px 16px rgba(0,0,0,0.08);
  --shadow-md:   0 4px 20px rgba(59,42,26,.14);
  --shadow-lg:   0 8px 40px rgba(59,42,26,.22);
  --transition:  200ms ease;
}

/* ─── Reset ─────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'DM Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button { cursor: pointer; border: none; background: none; font-family: inherit; }
input  { font-family: inherit; }
img    { display: block; max-width: 100%; }

/* ─── Body — fondo con textura sutil ─────────── */
body {
  background-color: var(--cream);
  background-image:
    radial-gradient(ellipse at 20% 20%, rgba(196,127,44,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(92,122,78,0.06)  0%, transparent 50%);
}

/* ─── Pantalla ───────────────────────────────── */
.screen {
  display: none;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
}
.screen.active { display: flex; }

#screen-main {
  position: relative;
  height: 100dvh;
  overflow: hidden;
}
#screen-main.active {
  display: block;
}

/* ═══════════════════════════════════════════════
   ZONA SUPERIOR — MENÚ
═══════════════════════════════════════════════ */
.menu-zone {
  position: absolute;
  top: 0; left: 0; right: 0;
  bottom: 110px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--cream);
  background-image:
    radial-gradient(ellipse at 20% 20%, rgba(196,127,44,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(92,122,78,0.06)  0%, transparent 50%);
}

/* ─── Header ─────────────────────────────────── */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px 12px;
  background: var(--white);
  border-bottom: 1px solid var(--sand);
  flex-shrink: 0;
}
.logo-img {
  height: 34px;
  width: auto;
  object-fit: contain;
}
.clock {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--brown2);
  letter-spacing: .04em;
}

/* ─── Selector de familias (círculos 2×2) ────── */
.family-selector {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  padding: 28px 28px 20px;
  place-items: center;
  align-content: center;
  min-height: 0;
}

.family-circle {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 20px;
  font-weight: 700;
  border: none;
  transition: transform .18s ease, box-shadow .18s ease;
  box-shadow: 0 4px 20px rgba(0,0,0,0.14);
  animation: circleIn .35s ease both;
  user-select: none;
}
.family-circle:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 30px rgba(0,0,0,0.22);
}
.family-circle:active { transform: scale(.94); }

@keyframes circleIn {
  from { opacity: 0; transform: scale(.80); }
  to   { opacity: 1; transform: scale(1); }
}

/* ─── Vista de productos ─────────────────────── */
.product-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}

/* ─── Barra de familia (nombre + botón volver) ── */
.family-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 14px 20px;
  flex-shrink: 0;
}

.family-bar-name {
  font-family: 'DM Sans', sans-serif;
  font-size: 22px;
  font-weight: 700;
}

.btn-back-menu {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 0;
  background: none;
  border: none;
  cursor: pointer;
  transition: opacity var(--transition);
}
.btn-back-menu:hover { opacity: .75; }

.back-menu-icon {
  width: 40px; height: 40px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 9px;
  border-radius: var(--radius-sm);
}
.back-menu-icon span {
  border-radius: 50%;
  display: block;
}

.back-menu-label {
  font-family: 'DM Sans', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .10em;
}

/* ─── Subtítulo ──────────────────────────────── */
.section-label {
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .14em;
  color: var(--brown2);
  opacity: .7;
  padding: 12px 20px 6px;
  flex-shrink: 0;
  text-transform: uppercase;
}

/* ─── Carrusel de productos ──────────────────── */
.products-carousel {
  display: flex;
  gap: 14px;
  padding: 6px 20px 20px;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: rgba(196,127,44,0.3) transparent;
  flex: 1;
  align-items: flex-start;
  min-width: 0;
}
.products-carousel::-webkit-scrollbar { height: 4px; }
.products-carousel::-webkit-scrollbar-track { background: transparent; }
.products-carousel::-webkit-scrollbar-thumb {
  background: rgba(196,127,44,0.3);
  border-radius: 2px;
}

/* ─── Card de producto ───────────────────────── */
.product-card {
  scroll-snap-align: start;
  flex-shrink: 0;
  min-width: 200px;
  width: 200px;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  animation: cardFadeIn .4s ease both;
  transition: transform .2s ease, box-shadow .2s ease;
}
.product-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.14);
}
.product-card:active { transform: scale(.97); }

@keyframes cardFadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.product-card-img-wrap {
  width: 100%;
  height: 160px;
  overflow: hidden;
  position: relative;
}
.product-card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: var(--radius-md) var(--radius-md) 0 0;
}
.product-card-img-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  opacity: .3;
}
.product-card-body {
  padding: 12px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.product-card-name {
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 700;
  text-transform: uppercase;
  line-height: 1.25;
  letter-spacing: .03em;
}
.product-card-price {
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
}

/* ─── Loading / Error ────────────────────────── */
.menu-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 48px 20px;
  color: var(--brown2);
  font-size: 14px;
}
.spinner {
  width: 28px; height: 28px;
  border: 3px solid var(--sand);
  border-top-color: var(--caramel);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.menu-error {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 40px 20px;
  color: var(--brown2);
  font-size: 14px;
  text-align: center;
}
.menu-error button {
  background: var(--caramel);
  color: #fff;
  border-radius: var(--radius-sm);
  padding: 8px 20px;
  font-size: 13px;
  font-weight: 600;
}

/* ═══════════════════════════════════════════════
   ZONA INFERIOR — CARRITO
═══════════════════════════════════════════════ */
.cart-zone {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: var(--brown);
  padding: 14px 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 44dvh;
  z-index: 2;
}

.cart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.cart-title {
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .20em;
  color: var(--sand);
  text-transform: uppercase;
  opacity: .8;
}
.cart-total {
  font-family: 'DM Sans', sans-serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--caramel2);
  line-height: 1;
}

.cart-empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 52px;
}
.cart-empty-text {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--sand);
  opacity: .4;
}

.cart-items {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
  max-height: 35vh;
  scrollbar-width: thin;
  scrollbar-color: rgba(212,196,160,0.15) transparent;
}
.cart-items::-webkit-scrollbar { width: 3px; }
.cart-items::-webkit-scrollbar-track { background: transparent; }
.cart-items::-webkit-scrollbar-thumb {
  background: rgba(212,196,160,0.2);
  border-radius: 2px;
}

.cart-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 2px;
  border-bottom: 1px solid rgba(212, 196, 160, 0.10);
  animation: cartItemIn .22s ease both;
  flex-shrink: 0;
  width: 100%;
}
.cart-item:last-child { border-bottom: none; }

@keyframes cartItemIn {
  from { opacity: 0; transform: translateX(8px); }
  to   { opacity: 1; transform: translateX(0); }
}
.cart-item-bullet {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.cart-item-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.cart-item-name {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--cream);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cart-item-detail {
  font-size: 11px;
  color: var(--sand);
  opacity: .65;
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cart-item-price {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--caramel2);
  white-space: nowrap;
  flex-shrink: 0;
}
.cart-item-remove {
  font-size: 14px;
  color: var(--sand);
  line-height: 1;
  padding: 0 2px;
  flex-shrink: 0;
  opacity: .55;
  transition: color var(--transition), opacity var(--transition);
}
.cart-item-remove:hover { color: #E74C3C; opacity: 1; }

.btn-checkout {
  width: 100%;
  background: var(--caramel);
  color: var(--brown);
  border-radius: var(--radius-md);
  padding: 16px;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  transition: background var(--transition), transform var(--transition);
  flex-shrink: 0;
}
.btn-checkout:hover  { background: var(--caramel2); }
.btn-checkout:active { transform: scale(.98); }


/* ═══════════════════════════════════════════════
   POP-UP DE PRODUCTO
═══════════════════════════════════════════════ */
.popup-overlay {
  position: fixed; inset: 0;
  background: rgba(59,42,26,.45);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.popup-overlay.hidden { display: none !important; }

.popup-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 400px;
  max-height: 90dvh;
  overflow-y: auto;
  position: relative;
  border-top: 4px solid var(--caramel);
  animation: popupIn .25s ease;
  scrollbar-width: none;
  box-shadow: var(--shadow-lg);
}
.popup-card::-webkit-scrollbar { display: none; }

@keyframes popupIn {
  from { opacity: 0; transform: scale(.95); }
  to   { opacity: 1; transform: scale(1); }
}

.popup-close {
  position: absolute;
  top: 14px; right: 14px;
  width: 30px; height: 30px;
  background: var(--cream2);
  border-radius: 50%;
  font-size: 13px;
  color: var(--brown2);
  display: flex; align-items: center; justify-content: center;
  z-index: 10;
  transition: background var(--transition);
}
.popup-close:hover { background: var(--sand); }

.popup-image-wrap {
  width: 100%;
  height: 190px;
  overflow: hidden;
  position: relative;
  background: var(--cream2);
}
.popup-product-img {
  width: 100%; height: 100%;
  object-fit: cover;
}
.popup-img-placeholder {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 56px;
  opacity: .2;
  position: absolute; top: 0; left: 0;
}

.popup-body {
  padding: 22px 22px 28px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.popup-category-badge {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 99px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  align-self: flex-start;
}

.popup-product-name {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 700;
  font-style: italic;
  color: var(--brown);
  line-height: 1.2;
}

.popup-product-desc {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--brown2);
  line-height: 1.6;
  opacity: .85;
}

.popup-options {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-top: 2px;
}
.option-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.option-group-label {
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--brown2);
  opacity: .7;
}
.option-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.option-btn {
  padding: 8px 18px;
  border-radius: 99px;
  border: 1.5px solid var(--sand);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--brown2);
  background: transparent;
  transition: all .15s;
}
.option-btn.selected {
  background: var(--brown);
  color: var(--caramel2);
  border-color: transparent;
  font-weight: 600;
}
.option-btn:active { transform: scale(.95); }

.extras-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.extra-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--sand);
  background: var(--cream);
  cursor: pointer;
  transition: border-color var(--transition), background var(--transition);
  user-select: none;
}
.extra-item.selected {
  border-color: var(--brown);
  background: #f3ede0;
}
.extra-item input { display: none; }
.extra-item-check {
  width: 20px; height: 20px;
  border: 1.5px solid var(--sand);
  border-radius: 4px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  color: transparent;
  transition: all var(--transition);
}
.extra-item.radio .extra-item-check { border-radius: 50%; }
.extra-item.selected .extra-item-check {
  background: var(--brown);
  border-color: var(--brown);
  color: var(--caramel2);
}
.extra-item-info { flex: 1; }
.extra-item-name {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--brown);
}
.extra-item-price {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  color: var(--caramel);
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
}

.popup-footer {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--sand);
  margin-top: 4px;
}
.popup-price-wrap {
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.popup-price-label {
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  color: var(--brown2);
  letter-spacing: .08em;
  text-transform: uppercase;
  opacity: .7;
}
.popup-price {
  font-family: 'DM Sans', sans-serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--caramel);
  line-height: 1;
}
.btn-confirm-product {
  flex: 1;
  background: var(--brown);
  color: var(--caramel2);
  border-radius: var(--radius-md);
  padding: 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .06em;
  transition: background var(--transition), transform var(--transition), opacity var(--transition);
}
.btn-confirm-product:not(:disabled):hover {
  background: var(--brown2);
  transform: translateY(-1px);
}
.btn-confirm-product:not(:disabled):active { transform: scale(.97); }
.btn-confirm-product:disabled { opacity: .35; cursor: default; }


/* ═══════════════════════════════════════════════
   BOTTOM SHEET — CHECKOUT
═══════════════════════════════════════════════ */
.checkout-overlay {
  position: fixed; inset: 0;
  background: rgba(59,42,26,.5);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.checkout-overlay:not(.hidden) { display: flex; }

.checkout-sheet {
  background: var(--white);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  width: 100%;
  max-width: 520px;
  max-height: 92dvh;
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform .35s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: var(--shadow-lg);
}
.checkout-overlay.is-open .checkout-sheet {
  transform: translateY(0);
}

.checkout-drag-handle {
  width: 40px; height: 4px;
  background: var(--sand);
  border-radius: 2px;
  margin: 14px auto 0;
  flex-shrink: 0;
}
.checkout-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 16px 22px 48px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scrollbar-width: none;
}
.checkout-scroll::-webkit-scrollbar { display: none; }

.checkout-title {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .16em;
  color: var(--brown2);
  text-align: center;
  text-transform: uppercase;
  opacity: .7;
}

.checkout-items-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.checkout-item-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.checkout-item-bullet {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 5px;
}
.checkout-item-info { flex: 1; }
.checkout-item-name {
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--brown);
  line-height: 1.3;
}
.checkout-item-detail {
  font-size: 12px;
  color: var(--brown2);
  margin-top: 2px;
  opacity: .75;
}
.checkout-item-price {
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--caramel);
  white-space: nowrap;
  flex-shrink: 0;

  <!-- ═══════════════════════════════════════════════
       SCRIPTS — todo inline, sin config.js ni ventas.js
  ═══════════════════════════════════════════════ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // CONFIG — edita solo estas dos líneas
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  const SHEET_ID = '19SmPH3-xRrumrHPy0aq3KeMrSdavGQQ6yI9hYMND4Rg';

  // URL de acción del Google Form (ver instrucciones abajo)
  // Cuando lo tengas, reemplaza este string con tu URL real
  const GOOGLE_FORM_ACTION = 'https://docs.google.com/forms/u/0/d/e/1FAIpQLScyKJylEgpR5-MHx6eJUBxLQrRmFqt06D9mib9WqinTq129KA/formResponse';

  const FORM_FIELDS = {
    folio:      'entry.1775054388',
    fecha:      'entry.263034875',
    hora:       'entry.1189303513',
    cliente:    'entry.123516888',
    productos:  'entry.941695294',
    total:      'entry.907452114',
    metodoPago: 'entry.1893562899',
  };

  // Colores por familia (idénticos a los originales)
  const CATEGORY_COLORS = {
    'CAFÉ':       { bg: '#5C7A4E', text: '#FFFFFF' },
    'SMOOTHIES':  { bg: '#7B6BA8', text: '#FFFFFF' },
    'ALIMENTOS':  { bg: '#D4892A', text: '#FFFFFF' },
    'BEBIDAS':    { bg: '#1A1A1A', text: '#FFFFFF' },
  };
  const DEFAULT_CATEGORY_COLOR = { bg: '#3B2A1A', text: '#FFFFFF' };

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // MENU MODULE — lee Google Sheet como CSV público
  // Sin API Key. Sin OAuth. Sin restricciones.
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const MenuModule = (() => {

    const LOCAL_IMAGES = {
      'espresso doble':    'cafe-espressodoble.png',
      'lungo':             'cafe-lungo.png',
      'capuchino':         'cafe-capuccino.png',
      'latte':             'cafe-latte.png',
      'recovery':          'smoothie-recovery.png',
      'berry glow':        'smoothie-berry glow.png',
      'verde':             'smoothie-verde.png',
      'pan de masa madre': 'alimentos-panmasamadre.png',
      'granola artesanal': 'alimentos-granola.png',
      'caldo de hueso':    'alimentos-caldohueso.png',
    };

    let _menuData   = {};
    let _extrasData = {};

    function norm(str) { return (str || '').trim().toLowerCase(); }
    function naOrValue(val) {
      if (!val || norm(val) === 'n/a' || norm(val) === '') return null;
      return val.trim();
    }
    function parsePrice(val) {
      if (!val || String(val).trim() === '') return 0;
      const str     = String(val).trim();
      const cleaned = str.replace(/[^0-9.]/g, '');
      if (!cleaned) return null;
      return parseFloat(cleaned) || 0;
    }

    // URL CSV pública — funciona mientras el Sheet esté compartido "cualquiera con el enlace"
    function csvUrl(sheetName) {
      return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
    }

    // Parser CSV simple pero robusto (maneja comillas, comas dentro de campos)
    function parseCSV(text) {
      const rows = [];
      const lines = text.split(/\r?\n/);
      for (const line of lines) {
        if (!line.trim()) continue;
        const row = [];
        let field = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            if (inQuotes && line[i+1] === '"') { field += '"'; i++; }
            else inQuotes = !inQuotes;
          } else if (ch === ',' && !inQuotes) {
            row.push(field);
            field = '';
          } else {
            field += ch;
          }
        }
        row.push(field);
        rows.push(row);
      }
      return rows;
    }

    function getImage(productName, imgUrl) {
      if (imgUrl && imgUrl.startsWith('http')) return { type: 'url',   src: imgUrl };
      const local = LOCAL_IMAGES[norm(productName)];
      if (local) return { type: 'local', src: local };
      return { type: 'emoji', src: _familyEmoji(productName) };
    }

    function _familyEmoji(name) {
      const n = norm(name);
      if (n.includes('recovery') || n.includes('berry') || n.includes('verde')) return '🥤';
      if (n.includes('pan') || n.includes('granola') || n.includes('caldo'))    return '🍞';
      if (n.includes('coca') || n.includes('agua'))                              return '🧴';
      return '☕';
    }

    // Columnas MENÚ:
    // A:0 ID  B:1 CATEGORÍA  C:2 PRODUCTO  D:3 VARIANTE  E:4 PRECIO
    // F:5 TEMP  G:6 TAMAÑO  H:7 TIPO LECHE  I:8 EXTRAS  J:9 DESCRIPCIÓN
    // K:10 NOTA  L:11 ACTIVO  M:12 IMG_URL  N:13 FAMILIA
    function parseMenuRows(rows) {
      const byProduct = {};

      for (const row of rows) {
        if (norm(row[11]) !== 's') continue;

        const id       = (row[0]  || '').trim();
        const producto = (row[2]  || '').trim();
        const variante = (row[3]  || '').trim();
        const precio   = parsePrice(row[4]);
        const temp     = naOrValue(row[5]);
        const tamano   = naOrValue(row[6]);
        const leche    = naOrValue(row[7]);
        const extras   = naOrValue(row[8]);
        const desc     = (row[9]  || '').trim();
        const imgUrl   = (row[12] || '').trim();
        const familia  = (row[13] || '').trim().toUpperCase();

        if (!familia || !producto) continue;

        const key = `${familia}||${producto}`;

        if (!byProduct[key]) {
          byProduct[key] = {
            id, familia,
            nombre:      producto,
            descripcion: desc,
            imagen:      getImage(producto, imgUrl),
            variantes:   [],
            tieneTempOptions:     false,
            tieneTamanoOptions:   false,
            tieneExtras:          false,
            tieneVarianteOptions: false,
            grupoExtras:          null,
          };
        }

        byProduct[key].variantes.push({ id, variante, precio, temp, tamano, leche, extras });
        if (desc && !byProduct[key].descripcion) byProduct[key].descripcion = desc;
      }

      for (const p of Object.values(byProduct)) {
        const temps   = [...new Set(p.variantes.map(v => v.temp).filter(Boolean))];
        const tamanos = [...new Set(p.variantes.map(v => v.tamano).filter(Boolean))];
        const grupos  = [...new Set(p.variantes.map(v => v.extras).filter(Boolean))];

        p.tieneTempOptions   = temps.length > 0;
        p.tieneTamanoOptions = tamanos.length > 0;
        p.tieneExtras        = grupos.length > 0;
        p.grupoExtras        = grupos[0] || null;
        p.tempsDisponibles   = temps;
        p.precioPorVariante  = _buildPriceMap(p.variantes);

        const allNoTemp   = p.variantes.every(v => !v.temp);
        const allNoTamano = p.variantes.every(v => !v.tamano);
        p.tieneVarianteOptions = p.variantes.length > 1 && allNoTemp && allNoTamano;

        if (p.tieneVarianteOptions) {
          p.variantesDisponibles = p.variantes.map(v => {
            let label = v.variante.trim();
            const prefix = p.nombre.trim().toLowerCase();
            if (label.toLowerCase().startsWith(prefix)) {
              label = label.slice(p.nombre.trim().length).trim();
            }
            return { label: label || v.variante, varianteFull: v.variante, precio: v.precio };
          });
        }
      }

      const result = {};
      for (const p of Object.values(byProduct)) {
        if (!result[p.familia]) result[p.familia] = [];
        result[p.familia].push(p);
      }
      return result;
    }

    function _buildPriceMap(variantes) {
      const map = {};
      for (const v of variantes) {
        const key = `${v.temp || ''}||${v.tamano || ''}`;
        map[key] = v.precio;
      }
      return map;
    }

    // Columnas EXTRAS: A:ID  B:GRUPO  C:NOMBRE  D:DESC  E:PRECIO  F:ACTIVO  G:EXCLUSIVO
    function parseExtrasRows(rows) {
      const result = {};
      for (const row of rows) {
        if (norm(row[5]) !== 's') continue;
        const grupo     = (row[1] || '').trim().toUpperCase();
        const nombre    = (row[2] || '').trim();
        const desc      = (row[3] || '').trim();
        const precio    = parsePrice(row[4]) || 0;
        const exclusivo = naOrValue(row[6]);
        if (!result[grupo]) result[grupo] = [];
        result[grupo].push({ nombre, desc, precio, exclusivo });
      }
      return result;
    }

    async function load() {
      const loadingEl  = document.getElementById('menu-loading');
      const errorEl    = document.getElementById('menu-error');
      const carouselEl = document.getElementById('products-carousel');

      loadingEl.classList.remove('hidden');
      errorEl.classList.add('hidden');
      carouselEl.innerHTML = '';

      try {
        // Fetch paralelo de MENÚ y EXTRAS como CSV — sin API Key
        const [menuRes, extrasRes] = await Promise.all([
          fetch(csvUrl('MENÚ')),
          fetch(csvUrl('EXTRAS')),
        ]);

        if (!menuRes.ok) throw new Error(`CSV fetch failed: ${menuRes.status}`);

        const menuText   = await menuRes.text();
        const extrasText = extrasRes.ok ? await extrasRes.text() : '';

        // Saltar filas de encabezado (fila 1-3 son encabezados según el Sheet)
        const menuRows   = parseCSV(menuText).slice(3);
        const extrasRows = extrasText ? parseCSV(extrasText).slice(3) : [];

        _menuData   = parseMenuRows(menuRows);
        _extrasData = parseExtrasRows(extrasRows);

        loadingEl.classList.add('hidden');

        if (typeof App !== 'undefined') {
          App.onMenuLoaded(_menuData, _extrasData);
        }

      } catch (err) {
        console.error('[MenuModule] Error cargando menú:', err);
        loadingEl.classList.add('hidden');
        errorEl.classList.remove('hidden');
      }
    }

    function getPrice(producto, temp, tamano) {
      const key = `${temp || ''}||${tamano || ''}`;
      return (producto.precioPorVariante && producto.precioPorVariante[key]) || 0;
    }

    function getBasePrice(producto) {
      if (!producto.variantes.length) return null;
      const p = producto.variantes[0].precio;
      return (p === null) ? null : (p || 0);
    }

    function getTamanosForTemp(producto, temp) {
      return producto.variantes
        .filter(v => v.temp === temp && v.tamano)
        .map(v => ({ tamano: v.tamano, precio: v.precio }));
    }

    function getExtras(grupo) {
      if (!grupo) return [];
      return _extrasData[grupo.toUpperCase()] || [];
    }

    function getPriceForVariante(producto, varianteFull) {
      const v = producto.variantes.find(v => v.variante === varianteFull);
      return v ? (v.precio || 0) : 0;
    }

    return { load, getPrice, getBasePrice, getTamanosForTemp, getExtras, getPriceForVariante };
  })();


  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // VENTAS MODULE — Google Form sin OAuth
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const VentasModule = (() => {

    // Guarda la orden en el Sheet via Google Form.
    // No requiere login, no requiere API Key, funciona desde cualquier dispositivo.
    async function save(order) {
      // Si no se configuró el Form, saltar silenciosamente
      if (!GOOGLE_FORM_ACTION || GOOGLE_FORM_ACTION === 'TU_URL_DE_FORM_AQUÍ') {
        console.warn('[VentasModule] Google Form no configurado. Orden no guardada en Sheet.');
        return;
      }

      const productosStr = order.items.map(i => {
        let str = i.variante;
        if (i.extras && i.extras.length) str += ` (${i.extras.map(e => e.nombre).join(', ')})`;
        str += ` $${i.subtotal}`;
        return str;
      }).join(' | ');

      const fecha = order.fecha.toLocaleDateString('es-MX');
      const hora  = order.fecha.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: true });

      const body = new URLSearchParams();
      body.append(FORM_FIELDS.folio,      order.folio);
      body.append(FORM_FIELDS.fecha,      fecha);
      body.append(FORM_FIELDS.hora,       hora);
      body.append(FORM_FIELDS.cliente,    order.cliente);
      body.append(FORM_FIELDS.productos,  productosStr);
      body.append(FORM_FIELDS.total,      String(order.total));
      body.append(FORM_FIELDS.metodoPago, order.metodoPago);

      // Google Forms no permite CORS, usamos no-cors (la respuesta es opaca — está bien,
      // lo que importa es que el Form reciba los datos y los guarde en el Sheet)
      try {
        await fetch(GOOGLE_FORM_ACTION, {
          method: 'POST',
          mode:   'no-cors',
          body,
        });
      } catch (e) {
        console.warn('[VentasModule] Error enviando al Form:', e);
        // Guardar en cola offline
        _queueOffline(order);
      }
    }

    // Cola offline en localStorage — reintenta al reconectar
    const QUEUE_KEY = 'samsa_offline_queue';

    function _queueOffline(order) {
      const queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
      queue.push({ ...order, fecha: order.fecha.toISOString() });
      localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
    }

    async function flushOfflineQueue() {
      if (!GOOGLE_FORM_ACTION || GOOGLE_FORM_ACTION === 'TU_URL_DE_FORM_AQUÍ') return;
      const queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
      if (!queue.length) return;

      const remaining = [];
      for (const raw of queue) {
        try {
          await save({ ...raw, fecha: new Date(raw.fecha) });
        } catch {
          remaining.push(raw);
        }
      }
      localStorage.setItem(QUEUE_KEY, JSON.stringify(remaining));
    }

    // Intentar vaciar la cola cuando recupere conexión
    window.addEventListener('online', flushOfflineQueue);

    return { save };
  })();


  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // TICKET MODULE — PDF 80mm (idéntico al original)
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const TicketModule = (() => {
    const PAGE_W  = 80;
    const MARGIN  = 6;
    const CONTENT = PAGE_W - MARGIN * 2;

    function generate(order) {
      if (typeof window.jspdf === 'undefined' && typeof jsPDF === 'undefined') {
        console.error('[TicketModule] jsPDF no cargado.');
        return;
      }
      const { jsPDF } = window.jspdf || window;
      const docFinal = new jsPDF({ unit: 'mm', format: [PAGE_W, 297] });
      _generateToDoc(docFinal, order, PAGE_W, MARGIN, CONTENT);

      // Calcular alto real y re-generar con tamaño exacto
      // (aproximación: 8mm por ítem + 80mm fijo)
      const estimatedH = 80 + (order.items.length * 14) + 20;
      const doc2 = new jsPDF({ unit: 'mm', format: [PAGE_W, estimatedH] });
      _generateToDoc(doc2, order, PAGE_W, MARGIN, CONTENT);
      doc2.save(`${order.folio}-samsa-cafe.pdf`);
    }

    function _generateToDoc(doc, order, PAGE_W, MARGIN, CONTENT) {
      let y = MARGIN;

      function t(str, x, opts = {}) { doc.text(str, x, y, opts); }
      function nl(h = 4) { y += h; }
      function sf(size, style = 'normal') { doc.setFont('helvetica', style); doc.setFontSize(size); }
      function clr(r, g, b) { doc.setTextColor(r, g, b); }

      function line() {
        y += 1;
        doc.setDrawColor(180, 180, 160); doc.setLineWidth(0.2);
        doc.line(MARGIN, y, PAGE_W - MARGIN, y); y += 3;
      }
      function dashes() {
        y += 1;
        doc.setDrawColor(180, 180, 160);
        doc.setLineDashPattern([1, 1.5], 0); doc.setLineWidth(0.2);
        doc.line(MARGIN, y, PAGE_W - MARGIN, y);
        doc.setLineDashPattern([], 0); y += 3;
      }
      function fmtDate(d) { return d.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' }); }
      function fmtTime(d) { return d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: true }); }

      // Logo
      const logoImg = document.querySelector('.logo-img');
      if (logoImg && logoImg.complete && logoImg.naturalWidth > 0) {
        try {
          const canvas = document.createElement('canvas');
          canvas.width  = logoImg.naturalWidth;
          canvas.height = logoImg.naturalHeight;
          canvas.getContext('2d').drawImage(logoImg, 0, 0);
          const dataUrl = canvas.toDataURL('image/png');
          const logoH = 10;
          const logoW = (logoImg.naturalWidth / logoImg.naturalHeight) * logoH;
          doc.addImage(dataUrl, 'PNG', (PAGE_W - logoW) / 2, y, logoW, logoH);
          y += logoH + 2;
        } catch {
          sf(13, 'bold'); clr(59, 42, 26);
          t('samsa café', PAGE_W / 2, { align: 'center' }); nl(5);
        }
      } else {
        sf(13, 'bold'); clr(59, 42, 26);
        t('samsa café', PAGE_W / 2, { align: 'center' }); nl(5);
      }

      sf(7); clr(92, 61, 30);
      t('Samsa Café by Samsa Estudio', PAGE_W / 2, { align: 'center' }); nl(3.5);
      t('Av. Acueducto 4283, Colinas de San Javier', PAGE_W / 2, { align: 'center' }); nl(3.5);
      t('44660 Guadalajara, Jal. — Urbanta Colinas', PAGE_W / 2, { align: 'center' }); nl(3.5);
      t('samsapilates.com  |  +523323429996', PAGE_W / 2, { align: 'center' }); nl(3.5);
      t('@samsaestudio', PAGE_W / 2, { align: 'center' }); nl(3);

      line();

      sf(8, 'bold'); clr(59, 42, 26);
      t(order.folio, MARGIN);
      sf(8); t(fmtDate(order.fecha), PAGE_W - MARGIN, { align: 'right' });
      nl(4);
      sf(7); clr(92, 61, 30);
      t(fmtTime(order.fecha), MARGIN); nl(4);

      sf(8, 'bold'); clr(59, 42, 26);
      t(`ORDEN PARA: ${order.cliente}`, MARGIN); nl(4);
      sf(7.5); clr(92, 61, 30);
      t(`PAGO: ${order.metodoPago}`, MARGIN); nl(3);

      dashes();

      for (const item of order.items) {
        sf(8, 'bold'); clr(59, 42, 26);
        const nombreLines = doc.splitTextToSize(item.variante, CONTENT - 14);
        doc.text(nombreLines, MARGIN, y);
        sf(8); clr(196, 127, 44);
        t(`$${item.precioUnit}`, PAGE_W - MARGIN, { align: 'right' });
        y += nombreLines.length * 4;

        if (item.extras && item.extras.length) {
          sf(7); clr(92, 61, 30);
          for (const ex of item.extras) {
            t(`  + ${ex.nombre}`, MARGIN);
            clr(196, 127, 44);
            t(`+$${ex.precio}`, PAGE_W - MARGIN, { align: 'right' });
            clr(92, 61, 30);
            nl(3.5);
          }
        }
        nl(2);
      }

      line();

      sf(11, 'bold'); clr(59, 42, 26);
      t('TOTAL', MARGIN);
      clr(196, 127, 44);
      t(`$${order.total}`, PAGE_W - MARGIN, { align: 'right' });
      nl(6);

      dashes(); nl(2);

      sf(7); clr(92, 61, 30);
      t('¡Gracias por tu visita!  ✦  @samsaestudio', PAGE_W / 2, { align: 'center' });
    }

    return { generate };
  })();


  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // APP MODULE — lógica central de UI (idéntico al original)
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const App = (() => {

    let _menuData        = {};
    let _currentProduct  = null;
    let _selectedTemp    = null;
    let _selectedTamano  = null;
    let _selectedExtras  = [];
    let _selectedVariante = null;
    let _cart            = [];
    let _paymentMethod   = null;
    let _lastOrder       = null;

    function _rgba(hex, alpha) {
      const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      if (!r) return `rgba(0,0,0,${alpha})`;
      return `rgba(${parseInt(r[1],16)},${parseInt(r[2],16)},${parseInt(r[3],16)},${alpha})`;
    }

    function _catColor(cat) {
      return CATEGORY_COLORS[(cat || '').toUpperCase()] || DEFAULT_CATEGORY_COLOR;
    }

    function _startClock() {
      const el = document.getElementById('clock');
      function tick() {
        el.textContent = new Date().toLocaleTimeString('es-MX', {
          hour: '2-digit', minute: '2-digit', hour12: true,
        });
      }
      tick();
      setInterval(tick, 1000);
    }

    function _nextFolio() {
      const n = parseInt(localStorage.getItem('samsa_folio') || '0', 10) + 1;
      localStorage.setItem('samsa_folio', n);
      return `ORD-${String(n).padStart(3, '0')}`;
    }

    function _addCarouselWheelHandler() {
      const carousel = document.getElementById('products-carousel');
      carousel.addEventListener('wheel', (e) => {
        if (Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
        e.preventDefault();
        carousel.scrollLeft += e.deltaY;
      }, { passive: false });
    }

    function _capitalize(str) {
      if (!str) return '';
      return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
    }

    function onMenuLoaded(menuData) {
      _menuData = menuData;
      _renderFamilySelector();
    }

    function _renderFamilySelector() {
      const selector = document.getElementById('family-selector');
      selector.innerHTML = '';

      Object.keys(_menuData).forEach((familia, idx) => {
        const colors = _catColor(familia);
        const circle = document.createElement('button');
        circle.className = 'family-circle';
        circle.textContent = _capitalize(familia);
        circle.style.background = colors.bg;
        circle.style.color = colors.text;
        circle.style.animationDelay = `${idx * 90}ms`;
        circle.addEventListener('click', () => showFamilyProducts(familia));
        selector.appendChild(circle);
      });

      selector.classList.remove('hidden');
      document.getElementById('product-view').classList.add('hidden');
    }

    function showFamilyProducts(familia) {
      const colors = _catColor(familia);

      const bar     = document.getElementById('family-bar');
      const barName = document.getElementById('family-bar-name');
      bar.style.background  = colors.bg;
      barName.textContent   = _capitalize(familia);
      barName.style.color   = colors.text;

      const icon  = bar.querySelector('.back-menu-icon');
      const label = bar.querySelector('.back-menu-label');
      const iconBg  = colors.text === '#FFFFFF' ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.22)';
      const dotColor = colors.text;
      icon.style.background = iconBg;
      icon.querySelectorAll('span').forEach(s => s.style.background = dotColor);
      label.style.color = colors.text;

      document.getElementById('family-selector').classList.add('hidden');
      document.getElementById('product-view').classList.remove('hidden');

      _renderProducts(familia);
    }

    function showFamilyMenu() {
      document.getElementById('product-view').classList.add('hidden');
      document.getElementById('family-selector').classList.remove('hidden');
    }

    function _renderProducts(cat) {
      const carousel = document.getElementById('products-carousel');
      carousel.innerHTML = '';
      const productos = _menuData[cat] || [];
      const colors    = _catColor(cat);

      productos.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', p.nombre);
        card.style.background      = colors.bg;
        card.style.border          = 'none';
        card.style.animationDelay  = `${idx * 80}ms`;

        const imgWrap = document.createElement('div');
        imgWrap.className  = 'product-card-img-wrap';
        imgWrap.style.background = 'rgba(0,0,0,0.12)';

        if (p.imagen.type === 'emoji') {
          const ph = document.createElement('div');
          ph.className   = 'product-card-img-placeholder';
          ph.textContent = p.imagen.src;
          imgWrap.appendChild(ph);
        } else {
          const img = document.createElement('img');
          img.className = 'product-card-img';
          img.src = p.imagen.src;
          img.alt = p.nombre;
          img.onerror = () => {
            imgWrap.innerHTML = `<div class="product-card-img-placeholder">☕</div>`;
          };
          imgWrap.appendChild(img);
        }

        const body = document.createElement('div');
        body.className = 'product-card-body';

        const name = document.createElement('div');
        name.className   = 'product-card-name';
        name.textContent = p.nombre;

        const priceEl = document.createElement('div');
        priceEl.className   = 'product-card-price';
        const base = MenuModule.getBasePrice(p);
        priceEl.textContent = (base !== null && base > 0) ? `desde $${base}` : '$—';

        name.style.color    = colors.text;
        priceEl.style.color = colors.text === '#FFFFFF'
          ? 'rgba(255,255,255,0.82)'
          : 'rgba(26,26,26,0.68)';

        body.append(name, priceEl);
        card.append(imgWrap, body);

        card.addEventListener('click',   () => openProductPopup(p));
        card.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') openProductPopup(p);
        });

        carousel.appendChild(card);
      });
    }

    function openProductPopup(producto) {
      _currentProduct   = producto;
      _selectedTemp     = null;
      _selectedTamano   = null;
      _selectedExtras   = [];
      _selectedVariante = null;

      const colors = _catColor(producto.familia);

      document.getElementById('popup-card').style.borderTopColor = colors.bg;

      const imgEl = document.getElementById('popup-product-img');
      const phEl  = document.getElementById('popup-product-img-placeholder');
      if (producto.imagen.type === 'emoji') {
        imgEl.classList.add('hidden');
        phEl.classList.remove('hidden');
        phEl.textContent = producto.imagen.src;
      } else {
        phEl.classList.add('hidden');
        imgEl.classList.remove('hidden');
        imgEl.src = producto.imagen.src;
        imgEl.onerror = () => {
          imgEl.classList.add('hidden');
          phEl.classList.remove('hidden');
          phEl.textContent = '☕';
        };
      }

      const badge = document.getElementById('popup-category-badge');
      badge.textContent      = producto.familia;
      badge.style.background = colors.bg;
      badge.style.color      = colors.text;

      document.getElementById('popup-product-name').textContent = producto.nombre;
      document.getElementById('popup-product-desc').textContent = producto.descripcion || '';

      _buildPopupOptions(producto);
      _updatePopupPrice();

      document.getElementById('product-popup').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeProductPopup() {
      document.getElementById('product-popup').classList.add('hidden');
      document.body.style.overflow = '';
    }

    function _buildPopupOptions(p) {
      const container = document.getElementById('popup-options');
      container.innerHTML = '';

      if (p.tieneVarianteOptions) {
        const group = _createOptionGroup('ELIGE TU OPCIÓN', 'variante-group');
        const btns  = _createOptionButtons(
          p.variantesDisponibles.map(v => ({ label: `${v.label}  $${v.precio}`, value: v.varianteFull })),
          (varianteFull) => {
            _selectedVariante = varianteFull;
            _updatePopupPrice();
          },
          'variante',
        );
        group.appendChild(btns);
        container.appendChild(group);
        _buildExtrasOptions(p, container);
        return;
      }

      if (p.tieneTempOptions) {
        const group = _createOptionGroup('TEMPERATURA', 'temp-group');
        const btns  = _createOptionButtons(
          p.tempsDisponibles.map(t => ({ label: t, value: t })),
          (temp) => {
            _selectedTemp   = temp;
            _selectedTamano = null;
            _selectedExtras = [];
            _rebuildDependentOptions(p);
            _updatePopupPrice();
          },
          'temp',
        );
        group.appendChild(btns);
        container.appendChild(group);
        return;
      }

      _buildTamanoOptions(p, container);
      _buildExtrasOptions(p, container);
    }

    function _rebuildDependentOptions(p) {
      ['tamano-group', 'extras-group'].forEach(id => document.getElementById(id)?.remove());

      const container = document.getElementById('popup-options');

      if (_selectedTemp) {
        const tamanos = MenuModule.getTamanosForTemp(p, _selectedTemp);
        if (tamanos.length > 1) {
          _buildTamanoOptions(p, container, tamanos);
        } else if (tamanos.length === 1) {
          _selectedTamano = tamanos[0].tamano;
        }
      }

      _buildExtrasOptions(p, container);
      _updatePopupConfirmBtn();
    }

    function _buildTamanoOptions(p, container, tamanosPre) {
      const tamanos = tamanosPre || p.variantes
        .filter(v => v.tamano)
        .map(v => ({ tamano: v.tamano, precio: v.precio }));
      if (!tamanos.length) return;

      const group = _createOptionGroup('TAMAÑO', 'tamano-group');
      const btns  = _createOptionButtons(
        tamanos.map(({ tamano, precio }) => ({ label: `${tamano}  $${precio}`, value: tamano })),
        (tamano) => { _selectedTamano = tamano; _updatePopupPrice(); },
        'tamano',
      );
      group.appendChild(btns);
      container.appendChild(group);
    }

    function _buildExtrasOptions(p, container) {
      if (!p.tieneExtras) return;
      const extras = MenuModule.getExtras(p.grupoExtras);
      if (!extras.length) return;

      const group = _createOptionGroup('EXTRAS', 'extras-group');
      const list  = document.createElement('div');
      list.className = 'extras-list';

      for (const ex of extras) {
        const isRadio = !!ex.exclusivo;
        const item    = document.createElement('label');
        item.className = `extra-item${isRadio ? ' radio' : ''}`;

        const check = document.createElement('div');
        check.className   = 'extra-item-check';
        check.textContent = '✓';

        const info = document.createElement('div');
        info.className = 'extra-item-info';

        const nm = document.createElement('div');
        nm.className   = 'extra-item-name';
        nm.textContent = ex.nombre;
        info.appendChild(nm);
        if (ex.desc) {
          const ds = document.createElement('div');
          ds.style.cssText = 'font-size:11px;color:var(--brown2);margin-top:2px;opacity:.7;';
          ds.textContent = ex.desc;
          info.appendChild(ds);
        }

        const priceEl = document.createElement('div');
        priceEl.className   = 'extra-item-price';
        priceEl.textContent = ex.precio ? `+$${ex.precio}` : 'gratis';

        item.append(check, info, priceEl);

        item.addEventListener('click', () => {
          const idx = _selectedExtras.findIndex(e => e.nombre === ex.nombre);
          if (isRadio) {
            _selectedExtras = _selectedExtras.filter(e => {
              const d = extras.find(x => x.nombre === e.nombre);
              return !d || d.exclusivo !== ex.exclusivo;
            });
            list.querySelectorAll('.extra-item.radio').forEach(el => {
              const n = el.querySelector('.extra-item-name')?.textContent;
              const d = extras.find(x => x.nombre === n);
              if (d?.exclusivo === ex.exclusivo) el.classList.remove('selected');
            });
            if (idx === -1) {
              _selectedExtras.push({ nombre: ex.nombre, precio: ex.precio });
              item.classList.add('selected');
            }
          } else {
            if (idx === -1) {
              _selectedExtras.push({ nombre: ex.nombre, precio: ex.precio });
              item.classList.add('selected');
            } else {
              _selectedExtras.splice(idx, 1);
              item.classList.remove('selected');
            }
          }
          _updatePopupPrice();
        });

        list.appendChild(item);
      }

      group.appendChild(list);
      container.appendChild(group);
    }

    function _createOptionGroup(label, id) {
      const group = document.createElement('div');
      group.className = 'option-group';
      group.id = id;
      const lbl = document.createElement('div');
      lbl.className   = 'option-group-label';
      lbl.textContent = label;
      group.appendChild(lbl);
      return group;
    }

    function _createOptionButtons(options, onSelect, dataKey) {
      const wrap = document.createElement('div');
      wrap.className = 'option-buttons';
      for (const { label, value } of options) {
        const btn = document.createElement('button');
        btn.className         = 'option-btn';
        btn.textContent       = label;
        btn.dataset[dataKey]  = value;
        btn.addEventListener('click', () => {
          wrap.querySelectorAll('.option-btn').forEach(b =>
            b.classList.toggle('selected', b.dataset[dataKey] === value));
          onSelect(value);
        });
        wrap.appendChild(btn);
      }
      return wrap;
    }

    function _updatePopupPrice() {
      const p = _currentProduct;
      if (!p) return;

      let precio = 0;

      if (p.tieneVarianteOptions) {
        if (_selectedVariante) {
          precio = MenuModule.getPriceForVariante(p, _selectedVariante);
        } else {
          precio = MenuModule.getBasePrice(p);
        }
      } else if (!p.tieneTempOptions && !p.tieneTamanoOptions) {
        precio = MenuModule.getBasePrice(p);
      } else {
        precio = MenuModule.getPrice(p, _selectedTemp, _selectedTamano)
              || MenuModule.getBasePrice(p);
      }

      precio += _selectedExtras.reduce((s, e) => s + (e.precio || 0), 0);
      const priceDisplay = (precio === null || precio === 0) ? '$—' : `$${precio}`;
      document.getElementById('popup-price').textContent = priceDisplay;
      _updatePopupConfirmBtn();
    }

    function _updatePopupConfirmBtn() {
      const p   = _currentProduct;
      const btn = document.getElementById('btn-confirm-product');
      if (!p) { btn.disabled = true; return; }

      let ok = true;
      if (p.tieneVarianteOptions && !_selectedVariante) ok = false;
      if (p.tieneTempOptions && !_selectedTemp) ok = false;

      if (ok && (_selectedTemp || (!p.tieneTempOptions && p.tieneTamanoOptions))) {
        const tamanos = _selectedTemp
          ? MenuModule.getTamanosForTemp(p, _selectedTemp)
          : p.variantes.filter(v => v.tamano).map(v => ({ tamano: v.tamano }));
        if (tamanos.length > 1 && !_selectedTamano) ok = false;
      }

      btn.disabled = !ok;
    }

    function confirmProduct() {
      const p = _currentProduct;
      if (!p) return;

      let precioUnit   = 0;
      let varianteName = p.nombre;

      if (p.tieneVarianteOptions && _selectedVariante) {
        precioUnit   = MenuModule.getPriceForVariante(p, _selectedVariante);
        const vData  = p.variantesDisponibles.find(v => v.varianteFull === _selectedVariante);
        varianteName = vData ? `${p.nombre} — ${vData.label}` : p.nombre;
      } else {
        precioUnit = MenuModule.getPrice(p, _selectedTemp, _selectedTamano)
                 || MenuModule.getBasePrice(p);
        const parts = [p.nombre];
        if (_selectedTemp)   parts.push(_selectedTemp);
        if (_selectedTamano) parts.push(_selectedTamano);
        varianteName = parts.join(' ');
      }

      const precioExtras = _selectedExtras.reduce((s, e) => s + (e.precio || 0), 0);

      _cart.push({
        uid:         Date.now() + Math.random(),
        nombre:      p.nombre,
        variante:    varianteName,
        familia:     p.familia,
        temp:        _selectedTemp,
        tamano:      _selectedTamano,
        extras:      [..._selectedExtras],
        precioUnit,
        precioExtras,
        subtotal:    precioUnit + precioExtras,
      });

      _renderCart();
      closeProductPopup();
      _showToast(`${p.nombre} agregado ✦`);
    }

    function _renderCart() {
      const container   = document.getElementById('cart-items');
      const emptyEl     = document.getElementById('cart-empty');
      const totalEl     = document.getElementById('cart-total');
      const checkoutBtn = document.getElementById('btn-checkout');

      if (_cart.length === 0) {
        container.innerHTML = '';
        container.classList.add('hidden');
        emptyEl.classList.remove('hidden');
        checkoutBtn.classList.add('hidden');
        totalEl.textContent = '$0';
        return;
      }

      emptyEl.classList.add('hidden');
      container.classList.remove('hidden');
      checkoutBtn.classList.remove('hidden');
      container.innerHTML = '';

      let total = 0;
      for (const item of _cart) {
        total += item.subtotal;
        const colors = _catColor(item.familia);

        const el = document.createElement('div');
        el.className = 'cart-item';

        const bullet = document.createElement('div');
        bullet.className        = 'cart-item-bullet';
        bullet.style.background = colors.bg;

        const info = document.createElement('div');
        info.className = 'cart-item-info';

        const name = document.createElement('div');
        name.className   = 'cart-item-name';
        name.textContent = item.variante;
        info.appendChild(name);

        if (item.extras.length) {
          const detail = document.createElement('div');
          detail.className   = 'cart-item-detail';
          detail.textContent = item.extras.map(e => e.nombre).join(', ');
          info.appendChild(detail);
        }

        const price = document.createElement('div');
        price.className   = 'cart-item-price';
        price.textContent = `$${item.subtotal}`;

        const remove = document.createElement('button');
        remove.className  = 'cart-item-remove';
        remove.textContent = '✕';
        remove.setAttribute('aria-label', `Quitar ${item.nombre}`);
        remove.addEventListener('click', (e) => {
          e.stopPropagation();
          _cart = _cart.filter(i => i.uid !== item.uid);
          _renderCart();
        });

        el.append(bullet, info, price, remove);
        container.appendChild(el);
      }

      totalEl.textContent = `$${total}`;
    }

    function openCheckout() {
      if (_cart.length === 0) return;
      _paymentMethod = null;

      document.getElementById('input-customer-name').value = '';
      document.querySelectorAll('.payment-btn').forEach(b => b.classList.remove('active'));
      const confirmBtn = document.getElementById('btn-confirm-order');
      confirmBtn.disabled    = true;
      confirmBtn.textContent = 'CONFIRMAR ORDEN';

      const list  = document.getElementById('checkout-items-list');
      list.innerHTML = '';
      let total = 0;

      for (const item of _cart) {
        const colors = _catColor(item.familia);
        total += item.subtotal;

        const row    = document.createElement('div');
        row.className = 'checkout-item-row';

        const bullet = document.createElement('div');
        bullet.className        = 'checkout-item-bullet';
        bullet.style.background = colors.bg;

        const info = document.createElement('div');
        info.className = 'checkout-item-info';

        const nm = document.createElement('div');
        nm.className   = 'checkout-item-name';
        nm.textContent = item.variante;
        info.appendChild(nm);

        if (item.extras.length) {
          const dt = document.createElement('div');
          dt.className   = 'checkout-item-detail';
          dt.textContent = item.extras.map(e => `+ ${e.nombre}`).join('  ');
          info.appendChild(dt);
        }

        const pr = document.createElement('div');
        pr.className   = 'checkout-item-price';
        pr.textContent = `$${item.subtotal}`;

        row.append(bullet, info, pr);
        list.appendChild(row);
      }

      document.getElementById('checkout-total-display').textContent = `$${total}`;

      const overlay = document.getElementById('checkout-overlay');
      overlay.classList.remove('hidden');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        overlay.classList.add('is-open');
      }));
      document.body.style.overflow = 'hidden';
      setTimeout(() => document.getElementById('input-customer-name').focus(), 380);
    }

    function closeCheckout() {
      const overlay = document.getElementById('checkout-overlay');
      overlay.classList.remove('is-open');
      setTimeout(() => overlay.classList.add('hidden'), 380);
      document.body.style.overflow = '';
    }

    function selectPayment(btn) {
      _paymentMethod = btn.dataset.method;
      document.querySelectorAll('.payment-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateCheckoutValidity();
    }

    function updateCheckoutValidity() {
      const name = document.getElementById('input-customer-name').value.trim();
      document.getElementById('btn-confirm-order').disabled = !(name && _paymentMethod);
    }

    async function confirmOrder() {
      const name = document.getElementById('input-customer-name').value.trim();
      if (!name || !_paymentMethod) return;

      const btn = document.getElementById('btn-confirm-order');
      btn.disabled    = true;
      btn.textContent = 'GUARDANDO…';

      const folio = _nextFolio();
      const total = _cart.reduce((s, i) => s + i.subtotal, 0);

      _lastOrder = {
        folio,
        fecha:      new Date(),
        cliente:    name,
        metodoPago: _paymentMethod,
        items:      [..._cart],
        total,
      };

      // Guardar en Sheet vía Google Form — sin OAuth, sin popup de login
      try {
        await VentasModule.save(_lastOrder);
      } catch (e) {
        console.warn('[App] Venta encolada localmente:', e.message);
      }

      closeCheckout();
      setTimeout(() => _showConfirmation(_lastOrder), 420);
    }

    function _showConfirmation(order) {
      document.getElementById('confirmation-folio').textContent    = order.folio;
      document.getElementById('confirmation-customer').textContent = `Para: ${order.cliente}`;
      document.getElementById('confirmation-popup').classList.remove('hidden');
      setTimeout(() => TicketModule.generate(order), 500);
    }

    function downloadTicket() {
      if (_lastOrder) TicketModule.generate(_lastOrder);
    }

    function newOrder() {
      _cart      = [];
      _lastOrder = null;
      document.getElementById('confirmation-popup').classList.add('hidden');
      document.body.style.overflow = '';
      _renderCart();
    }

    let _toastTimer = null;
    function _showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => el.classList.add('hidden'), 2400);
    }

    function init() {
      _startClock();
      _addCarouselWheelHandler();
      MenuModule.load();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    return {
      onMenuLoaded,
      showFamilyProducts,
      showFamilyMenu,
      openProductPopup,
      closeProductPopup,
      confirmProduct,
      openCheckout,
      closeCheckout,
      selectPayment,
      updateCheckoutValidity,
      confirmOrder,
      downloadTicket,
      newOrder,
    };
  })();
  </script>

</body>
</html>
